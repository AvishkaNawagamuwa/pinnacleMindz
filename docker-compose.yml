version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pinnacle-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-PinnacleSecret123!}
      POSTGRES_DB: ${DB_NAME:-pinnacle_mindz}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/prisma/seed.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - pinnacle-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pinnacle-backend
    restart: always
    depends_on:
      - postgres
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-PinnacleSecret123!}@postgres:5432/${DB_NAME:-pinnacle_mindz}?schema=public
      JWT_SECRET: ${JWT_SECRET:-production-pinnacle-mindz-secure-secret-key-2026}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${DOMAIN_URL:-https://app.pinnaclemindz.com}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    networks:
      - pinnacle-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pinnacle-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - uploads_data:/usr/share/nginx/html/uploads:ro
    networks:
      - pinnacle-net

volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local

networks:
  pinnacle-net:
    driver: bridge
