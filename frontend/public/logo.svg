<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#111e38" />
      <stop offset="60%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#050814" />
    </radialGradient>

    <!-- Neon Cyan & Electric Blue Gradients -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="electricGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="pinnacleGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Ring with Tech Dash Pattern -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="4" opacity="0.4" />
  <circle cx="250" cy="250" r="230" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="12 8 4 8" opacity="0.6" />
  
  <!-- Main Circular Dark Backdrop -->
  <circle cx="250" cy="250" r="222" fill="url(#bgGrad)" stroke="url(#cyanBlueGrad)" stroke-width="5" filter="url(#softGlow)" />

  <!-- Circuit Tech Lines & Orbiting Nodes -->
  <g opacity="0.25" stroke="#00f0ff" stroke-width="1.5" fill="none">
    <path d="M 60 250 H 120 L 150 220 H 180" />
    <circle cx="60" cy="250" r="3" fill="#00f0ff" />
    <circle cx="180" cy="220" r="3" fill="#00f0ff" />

    <path d="M 440 250 H 380 L 350 280 H 320" />
    <circle cx="440" cy="250" r="3" fill="#00f0ff" />
    <circle cx="320" cy="280" r="3" fill="#00f0ff" />

    <path d="M 250 50 V 90 L 270 110" />
    <circle cx="250" cy="50" r="3" fill="#00f0ff" />
    <circle cx="270" cy="110" r="3" fill="#00f0ff" />
  </g>

  <!-- Central Pinnacle / Mountain Peak Peak Motif (Symbolizing Pinnacle Mindz) -->
  <g id="pinnacle-peaks">
    <!-- Background mountain -->
    <polygon points="250,110 320,270 180,270" fill="url(#pinnacleGrad)" opacity="0.45" />
    <!-- Foreground sharp apex -->
    <polygon points="250,95 295,240 205,240" fill="url(#cyanBlueGrad)" opacity="0.85" filter="url(#softGlow)" />
    <!-- Peak highlight line -->
    <line x1="250" y1="95" x2="250" y2="240" stroke="#ffffff" stroke-width="2.5" opacity="0.9" />
  </g>

  <!-- Modern Programmer Silhouette with Hoodie & Glowing Headset -->
  <g id="programmer-avatar" transform="translate(0, 10)">
    <!-- Programmer Head / Hoodie -->
    <path d="M 205 270 C 205 200, 295 200, 295 270 C 295 300, 205 300, 205 270 Z" fill="#0b1329" stroke="#0ea5e9" stroke-width="3" />
    
    <!-- Face / Visor Glow (Neon Tech) -->
    <path d="M 220 245 C 225 235, 275 235, 280 245 C 282 258, 218 258, 220 245 Z" fill="#00f0ff" opacity="0.85" filter="url(#softGlow)" />

    <!-- Programmer Headset Arc & Glow Earcups -->
    <path d="M 200 250 C 195 200, 305 200, 300 250" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="5" stroke-linecap="round" filter="url(#softGlow)" />
    <rect x="190" y="240" width="12" height="24" rx="6" fill="#06b6d4" filter="url(#softGlow)" />
    <rect x="298" y="240" width="12" height="24" rx="6" fill="#06b6d4" filter="url(#softGlow)" />
    <!-- Mic boom -->
    <path d="M 196 258 Q 200 278 225 278" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="227" cy="278" r="3" fill="#22d3ee" filter="url(#softGlow)" />

    <!-- Programmer Body / Shoulders -->
    <path d="M 155 365 C 160 310, 210 295, 250 295 C 290 295, 340 310, 345 365 Z" fill="#0d1833" stroke="url(#cyanBlueGrad)" stroke-width="3.5" />
    <!-- Hoodie Zip / Accent -->
    <line x1="250" y1="295" x2="250" y2="365" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" opacity="0.8" />
  </g>

  <!-- Laptop / Workstation Screen in Front -->
  <g id="workstation">
    <!-- Laptop screen glow -->
    <polygon points="175,340 325,340 340,385 160,385" fill="#0f224a" stroke="#00f0ff" stroke-width="2.5" filter="url(#softGlow)" />
    <!-- Code Bracket < / > on Laptop -->
    <text x="250" y="370" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="bold" fill="#00f0ff" text-anchor="middle" filter="url(#softGlow)">
      &lt; / &gt;
    </text>
    <!-- Keyboard base plate -->
    <polygon points="145,385 355,385 375,405 125,405" fill="#070c1a" stroke="#2563eb" stroke-width="2" />
  </g>

  <!-- Glowing Code Symbol Ornaments (< and > on sides) -->
  <text x="125" y="260" font-family="'JetBrains Mono', monospace" font-size="44" font-weight="900" fill="#22d3ee" text-anchor="middle" filter="url(#glow)" opacity="0.9">&lt;</text>
  <text x="375" y="260" font-family="'JetBrains Mono', monospace" font-size="44" font-weight="900" fill="#22d3ee" text-anchor="middle" filter="url(#glow)" opacity="0.9">&gt;</text>

  <!-- Floating Binary / Code Dots -->
  <text x="135" y="180" font-family="'JetBrains Mono', monospace" font-size="14" fill="#38bdf8" opacity="0.6">0101</text>
  <text x="330" y="180" font-family="'JetBrains Mono', monospace" font-size="14" fill="#38bdf8" opacity="0.6">1010</text>
  <text x="250" y="150" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a5f3fc" text-anchor="middle" letter-spacing="3" opacity="0.8">PROJECT MENTORING</text>

  <!-- Banner Ribbons for PINNACLE MINDZ Branding -->
  <g id="brand-banner" transform="translate(0, 15)">
    <!-- Brand Plate -->
    <rect x="90" y="405" width="320" height="42" rx="21" fill="#070d1e" stroke="url(#cyanBlueGrad)" stroke-width="3" filter="url(#softGlow)" />
    <!-- Brand Name -->
    <text x="250" y="433" font-family="'Inter', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
      PINNACLE <tspan fill="#00f0ff">MINDZ</tspan>
    </text>
  </g>
</svg>
